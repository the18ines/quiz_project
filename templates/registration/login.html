{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8 mt-10">
  <h1 class="text-2xl font-bold text-blue-900 mb-6 text-center">🔐 Connexion</h1>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-1">Nom d'utilisateur</label>
      <input type="text" name="username" required
             class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <div class="mb-6">
      <label class="block text-gray-700 font-semibold mb-1">Mot de passe</label>
      <input type="password" name="password" required
             class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    {% if form.errors %}
      <p class="text-red-500 text-sm mb-4">Identifiants incorrects.</p>
    {% endif %}
    
    <button type="submit"
            class="w-full bg-blue-800 text-white py-2 rounded-lg font-semibold hover:bg-blue-900">
      Se connecter
    </button>
  </form>
</div>

{% endblock %}
